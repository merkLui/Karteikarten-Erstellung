<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Grundgerüst und Meta-Daten für die Karteikarten-Web-App -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karteikarten-Generator</title>

  <!-- Bootstrap & Google Fonts laden für modernes Styling -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navigationsleiste mit App-Titel -->
  <!-- Gradient-Header -->
  <nav class="navbar navbar-dark navbar-gradient shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Karteikarten-Generator</a>
    </div>
  </nav>

  <!-- Hauptbereich mit Karteikarten-Generator-Form und Ergebnissen -->
  <!-- Hauptbereich -->
  <main class="container py-5 d-flex justify-content-center">
    <div class="card shadow-lg generator-card w-100" style="max-width: 640px;">
      <div class="card-body">
        <h1 class="h3 text-center fw-bold mb-4">KI-gestützter Karteikarten-Generator</h1>

        <!-- API-Key -->
        <div class="mb-3">
          <label for="apiKey" class="form-label">API-Key</label>
          <input type="text" id="apiKey" class="form-control" placeholder="X-API-Key" required />
        </div>

        <!-- Upload-Formular -->
        <form id="uploadForm">
          <div class="mb-3">
            <label for="pdfFile" class="form-label">PDF-Datei</label>
            <input type="file" id="pdfFile" class="form-control" accept=".pdf" required />
          </div>

          <div class="mb-3">
            <label for="instructions" class="form-label">Zusätzliche Nutzer­anweisungen</label>
            <textarea id="instructions" class="form-control" rows="3"></textarea>
          </div>

          <button id="generateBtn" type="submit" class="btn btn-primary w-100">
            Generieren
          </button>
        </form>

        <!-- Fortschrittsanzeige -->
        <div id="progress" class="mt-4"></div>

        <!-- Karten-/CSV-Vorschau -->
        <div id="csvPreview" class="mt-4 table-responsive" style="display:none;"></div>

        <!-- Download-Knopf -->
        <button id="downloadBtn" class="btn btn-success w-100 mt-2" style="display:none;">
          CSV herunterladen
        </button>
      </div>
    </div>
  </main>

  <!-- Binde die Frontend-Logik nach dem DOM -->
  <script src="app.js"></script>
</body>
</html>
