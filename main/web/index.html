<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karteikarten-Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4 text-center">Karteikarten-Generator</h1>
    <div class="mb-3">
      <label for="apiKey" class="form-label">API-Key</label>
      <input type="text" id="apiKey" class="form-control" placeholder="X-API-Key" required>
    </div>
    <form id="uploadForm">
      <div class="mb-3">
        <label for="pdfFile" class="form-label">PDF-Datei</label>
        <input type="file" id="pdfFile" class="form-control" accept=".pdf" required>
      </div>
      <div class="mb-3">
        <label for="instructions" class="form-label">Zusätzliche Nutzeranweisungen</label>
        <textarea id="instructions" class="form-control" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Generieren</button>
    </form>
    <div id="progress" class="mt-3"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
